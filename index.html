<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Chọn nhiều nhóm lớp</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 30px;
        background-color: #f9f9f9;
      }

      h2 {
        color: #333;
        margin-bottom: 15px;
      }

      .row {
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      input[type="text"],
      select {
        padding: 8px 10px;
        font-size: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
        min-width: 200px;
      }

      select {
        min-width: 160px;
      }
      .selectNhom {
        width: 500px;
      }

      button {
        padding: 8px 14px;
        font-size: 15px;
        border: none;
        border-radius: 6px;
        background-color: #3498db;
        color: white;
        transition: background-color 0.2s ease;
      }

      button:hover {
        background-color: #2980b9;
      }

      button[onclick*="xoaTatCa"] {
        background-color: #e74c3c;
      }

      button[onclick*="xoaTatCa"]:hover {
        background-color: #c0392b;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        text-align: center;
        table-layout: fixed;
        margin-top: 15px;
        background-color: #fff;
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.05);
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 10px 6px;
        word-wrap: break-word;
      }

      th {
        background-color: #f0f0f0;
        font-weight: 600;
      }

      td {
        height: 60px;
        font-size: 14px;
        vertical-align: top;
      }

      td div {
        margin-bottom: 4px;
      }

      .info {
        background-color: #ecf0f1;
        padding: 8px 10px;
        margin-top: 5px;
        border-left: 4px solid #3498db;
        border-radius: 4px;
        font-size: 14px;
      }
      .nhom-lop-block {
        background-color: #dff0ff;
        border: 1px solid #3498db;
        border-radius: 6px;
        padding: 4px 6px;
        margin-bottom: 4px;
        text-align: left;
      }
      .container_themDuLieu {
        padding: 6px 0px;
      }

      textarea {
        width: 60%;
        min-height: 90px;
        padding: 10px 12px;
        font-size: 13px;
        border: 1.5px solid #ccc;
        border-radius: 8px;

        resize: horizontal;
      }

      .cell {
        padding: 10px;
        font-size: 13px;

        text-align: center;
        vertical-align: middle;

        white-space: pre-line;
        font-weight: 500;
      }
      .red {
        background-color: #ffe5e5;
        color: #d93025;
        border: 1px solid #f5c2c2;
      }

      .orange {
        background-color: #fff4e5;
        color: #e37400;
        border: 1px solid #ffd8a8;
      }

      .green {
        background-color: #e6f4ea;
        color: #188038;
        border: 1px solid #b7e1cd;
      }
    </style>
  </head>

  <body>
    <div id="container">
      <div class="row"></div>
    </div>

    <button onclick="themMaHocPhan()">Thêm học phần</button>
    <button onclick="xoaTatCa()" style="margin-top: 20px">
      Xóa toàn bộ thời khóa biểu
    </button>
    <button onclick="sinhTatCaLich()">Sinh tất cả lịch hợp lệ</button>

    <div id="chonLich" style="margin-top: 15px"></div>

    <h2>Thời khóa biểu</h2>
    <table id="tkb">
      <thead>
        <tr>
          <th>Tiết</th>
          <th>Thứ 2</th>
          <th>Thứ 3</th>
          <th>Thứ 4</th>
          <th>Thứ 5</th>
          <th>Thứ 6</th>
          <th>Thứ 7</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button onclick="themDuLieu()">Thêm dữ liệu thủ công</button>
    <button onclick="xacNhanDuLieu()">Xác nhận dữ liệu nhập vào</button>
    <div id="container_themDuLieu" class="container_themDuLieu">
      <div id="list_rows"></div>
    </div>
    <script>
      let data = {};
      let DATA = {};

      let maHocPhanDaChon = []; //lưu các mã học phần trong thời khóa biểu
      let thoiKhoaBieus = []; //danh sách tất cả thời khóa biểu có thể tạo

      localStorage.setItem("DATA", JSON.stringify(DATA));
      window.addEventListener("load", () => {
        const savedData = localStorage.getItem("DATA");

        if (savedData) {
          DATA = JSON.parse(savedData);
          console.log("Dữ liệu đã khôi phục:", DATA);
        }
      });
      const tbody = document.querySelector("#tkb tbody");

      function forEachCell(callback) {
        for (let tiet = 1; tiet <= 9; tiet++) {
          for (let thu = 2; thu <= 7; thu++) {
            const id = `t${thu}t${tiet}`;
            const cell = document.getElementById(id);
            if (cell) callback(cell, thu, tiet);
          }
        }
      }

      for (let tiet = 1; tiet <= 9; tiet++) {
        const tr = document.createElement("tr");
        const tdTiet = document.createElement("td");
        tdTiet.textContent = `Tiết ${tiet}`;
        tr.appendChild(tdTiet);

        for (let thu = 2; thu <= 7; thu++) {
          const td = document.createElement("td");
          td.id = `t${thu}t${tiet}`;
          tr.appendChild(td);
        }

        tbody.appendChild(tr);
      }

      //tach tiet hoc ---1234-----
      function tachTiet(str) {
        if (!str) return [];

        return str
          .replace(/-/g, "")
          .split("")
          .map(Number)
          .filter((n) => !isNaN(n));
      }

      //them ma hoc phan cho thoi khoa bieu
      function themMaHocPhan() {
        const container = document.getElementById("container");
        const row = document.createElement("div");
        row.className = "row";

        // tạo select mã học phần
        const selectMaHP = taoSelectMaHP();
        selectMaHP.className = "selectMaHP";

        // tạo select nhóm
        const selectNhom = document.createElement("select");

        selectNhom.className = "selectNh";
        selectNhom.innerHTML = `<option value="">-- Chọn nhóm --</option>`;

        //sử lý sự kiện chọn một mã học phần, cập nhật lại nhóm
        selectMaHP.onchange = function () {
          const oldValue = this.dataset.oldValue;
          const newValue = this.value;

          if (oldValue) {
            maHocPhanDaChon = maHocPhanDaChon.filter((ma) => ma !== oldValue);
            xoaThoiBieuHP(oldValue);
          }

          if (newValue) {
            maHocPhanDaChon.push(newValue);
          }

          capNhatDropdownSelect(this, selectNhom);

          this.dataset.oldValue = newValue;
        };

        const btn = document.createElement("button");
        btn.textContent = "🗑";

        btn.onclick = () => {
          const selectedValue = selectMaHP.value;

          if (selectedValue) {
            maHocPhanDaChon = maHocPhanDaChon.filter(
              (ma) => ma !== selectedValue,
            );
          }
          xoaThoiBieuHP(selectedValue);

          row.remove();
        };

        row.appendChild(selectMaHP);
        row.appendChild(selectNhom);
        row.appendChild(btn);

        container.appendChild(row);
      }

      //xoa ma hoc phan
      function xoaMaHocPhan(maHP, maLop = null) {
        forEachCell((cell) => {
          const children = Array.from(cell.children);
          children.forEach((child) => {
            if (
              child.textContent.includes(maHP) &&
              (!maLop || child.textContent.includes(maLop))
            ) {
              cell.removeChild(child);
            }
          });
        });
      }

      //tạo input thêm dữ liệu từ người dùng
      function themDuLieu() {
        const container = document.getElementById("container_themDuLieu");

        const list = document.getElementById("list_rows");

        const row = document.createElement("div");
        row.className = "row";

        row.innerHTML = `
  <input type="text" class="maHocPhanInput" placeholder="Nhập mã học phần" />
  <textarea class="duLieuThemHocPhan"></textarea>
  <button style="background-color: red;" onclick="xoaDongDuLieu(this)">Xóa</button>
`;

        list.appendChild(row);
      }
      //xử lý dữ liệu người dùng nhập vào
      function xacNhanDuLieu() {
        const rows = document.querySelectorAll("#list_rows .row");

        rows.forEach((row) => {
          const maHocPhanInput = row
            .querySelector(".maHocPhanInput")
            .value.trim()
            .toUpperCase();
          const duLieu = row.querySelector(".duLieuThemHocPhan").value;
          if (!maHocPhanInput) {
            alert("Vui lòng nhập mã học phần!");
            return;
          }

          const ketQua = xuLyDuLieuNhapVao(duLieu);

          if (ketQua.length > 0) {
            DATA[maHocPhanInput] = ketQua;
          }
        });
        mahpList = layDanhSachMaHPTrongDuLieu();
        mahpList.forEach((mahp) => {
          if (!mahpToColor[mahp]) {
            mahpToColor[mahp] = getRandomColor();
          }
        });
        console.log(DATA);
      }
      //vẽ màu ngẫu nhiên cho từng mã học phần
      let currentHue = 0;
      function getRandomColor() {
        const saturation = 60 + Math.random() * 10;
        const lightness = 65 + Math.random() * 10;

        const color = `hsl(${currentHue}, ${saturation}%, ${lightness}%)`;

        currentHue = (currentHue + 36) % 360;

        return color;
      }

      //xu ly du lieu nhap vao tu nguoi dung,
      function xuLyDuLieuNhapVao(text) {
        let dl = [];
        let lines = text
          .split("\n")
          .map((l) => l.trim())
          .filter((l) => l !== "");

        let prevNhom = null;
        let prevlopHP = null;

        for (let i = 0; i < lines.length; i++) {
          let row = lines[i];

          if (/Thạc\s*sỹ|Tiến\s*sĩ/i.test(row)) continue;

          let giangVien = lines[i + 1] || "";

          let parts = row.split(/\s+/).filter((p) => p !== "x");

          let obj = {};

          if (parts.length <= 6) {
            obj.nhom = prevNhom;
            obj.lopHP = prevlopHP;
            obj.thu = parts[0];
            obj.tinChi = parseInt(parts[1], 10);
            obj.siSo = parseInt(parts[2], 10);
            obj.siSoCon = parseInt(parts[3], 10);
            tt = tachTiet(parts[4]);
            obj.tiet = tt;
            obj.phong = parts[5];
          } else {
            obj.nhom = parts[0];
            prevNhom = parts[0];

            obj.lopHP = parts[1];
            prevlopHP = parts[1];

            obj.thu = parts[2];
            obj.tinChi = parseInt(parts[3], 10);
            obj.siSo = parseInt(parts[4], 10);
            obj.siSoCon = parseInt(parts[5], 10);
            tt = tachTiet(parts[6]);
            obj.tiet = tt;
            obj.phong = parts[7];
          }

          obj.gv = giangVien;

          dl.push(obj);
          i++;
        }

        // Gom nhóm theo nhom + lop hoc phan
        let grouped = [];
        let map = {};

        dl.forEach((item) => {
          let key = item.nhom + "|" + item.lopHP;
          if (!map[key]) {
            // tạo bản ghi mới
            map[key] = {
              nhom: item.nhom,
              lopHP: item.lopHP,
              tinChi: item.tinChi,
              siSo: item.siSo,
              siSoCon: item.siSoCon,
              phong: item.phong,
              gv: item.gv,
              lich: [],
            };
            grouped.push(map[key]);
          }
          map[key].lich.push({ thu: item.thu, tiet: item.tiet });
        });

        return grouped;
      }

      // Xóa dòng dữ liệu người dùng nhập vào
      //sẽ xóa luôn dữ liệu lưu trong DATA
      function xoaDongDuLieu(btn) {
        const row = btn.parentElement;

        const isConfirm = confirm(
          "Bạn có chắc chắn muốn xóa dòng dữ liệu này không?",
        );
        if (!isConfirm) return;

        const text = row.querySelector(".duLieuThemHocPhan").value;
        if (!text) {
          row.remove();
          return;
        }

        const ma = row
          .querySelector(".maHocPhanInput")
          .value.trim()
          .toUpperCase();

        if (ma && DATA[ma]) {
          delete DATA[ma];
        }

        row.remove();
      }

      //lấy danh sách các mã học phần để lấy thời khóa biểu
      function layDanhSachMaHPTrongDuLieu() {
        return Object.keys(DATA); // ["CT101", "CT102", ...]
      }

      //lấy danh sách các mã học phần đang chọn
      document
        .getElementById("container")
        .addEventListener("change", function (e) {
          if (e.target.classList.contains("selectMaHP")) {
            const selects = document.querySelectorAll(".selectMaHP");
            maHocPhanDaChon = [];
            selects.forEach((s) => {
              if (s.value && !maHocPhanDaChon.includes(s.value)) {
                maHocPhanDaChon.push(s.value);
              }
            });
          }
        });

      //tạo ra select mã học phần
      function taoSelectMaHP() {
        const select = document.createElement("select");

        select.innerHTML = `<option value="">-- Chọn mã học phần --</option>`;
        select.className = "selectMaHP";

        const danhSachMaHP = [...new Set(layDanhSachMaHPTrongDuLieu())];

        // lọc bỏ mã đã chọn
        const danhSachConLai = danhSachMaHP.filter(
          (ma) => !maHocPhanDaChon.includes(ma),
        );

        danhSachConLai.forEach((maHocPhan) => {
          const option = document.createElement("option");
          option.value = maHocPhan;
          option.textContent = maHocPhan;
          select.appendChild(option);
        });

        return select;
      }

      //tạo danh sách các nhóm trong mã học phần
      function capNhatDropdownSelect(selectMaHP, selectNhom) {
        if (!DATA) return;

        const maHPChon = selectMaHP.value;

        console.log(maHPChon);
        if (!maHPChon) return;

        selectNhom.innerHTML = `<option value="">-- Chọn nhóm --</option>`;

        const nhoms = DATA[maHPChon] || [];

        nhoms.forEach((item) => {
          const option = document.createElement("option");
          option.value = item.nhom;
          option.textContent = `Nhóm ${item.nhom} - GV ${item.gv}`;
          selectNhom.appendChild(option);
        });
      }

      function getColorForMaHP(mahp) {
        return mahpToColor[mahp];
      }
      let mahpToColor = {};
      function veThoiKhoaBieu(lop, maHocPhan) {
        lop.lich.forEach((lichItem) => {
          lichItem.tiet.forEach((tiet) => {
            const id = `t${lichItem.thu}t${tiet}`;
            const cell = document.getElementById(id);
            if (!cell) return;

            cell.classList.add("cell");

            const bgColor = getColorForMaHP(maHocPhan);

            cell.style.backgroundColor = bgColor;

            cell.textContent = `${maHocPhan} ${lop.nhom}\n${lop.phong}\n${lop.siSo} - ${lop.siSoCon}`;
          });
        });
      }
      //xóa nhóm học trong cùng một mã học phần để hiện thị lên tkb
      function xoaThoiBieuHP(mahp) {
        forEachCell((cell) => {
          if (cell.textContent.trim().includes(mahp.trim())) {
            cell.textContent = "";
            cell.style.backgroundColor = "";
          }
        });
      }
      //xóa toàn bộ bảng trong thời khóa biểu
      function xoaTatCa() {
        forEachCell((cell) => {
          cell.innerHTML = "";
          cell.style.backgroundColor = "";
        });

        document.querySelectorAll(".info").forEach((info) => info.remove());
      }

      //trả về học phần đang được thêm, khi đang xét event chọn nhóm
      function layThongTinChon(e) {
        const parent = e.target.parentElement;
        return {
          mahp: parent.querySelector(".selectMaHP")?.value,
          nhom: e.target.value,
        };
      }

      function timLopHoc(ds, nhom) {
        return ds.find((item) => item.nhom === nhom);
      }

      //kiểm tra có trùng tiết hay không, trả về true nếu trùng
      function kiemTraTrungTiet(tietHoc) {
        let cell = document.getElementById(tietHoc);
        if (cell && cell.textContent.trim() !== "") {
          return true;
        }
        return false;
      }
      function kiemTraTrungLich(item) {
        const lop = item.lop;
        if (!lop || !lop.lich) return false;

        for (const lichItem of lop.lich) {
          const thu = lichItem.thu;

          for (const tiet of lichItem.tiet) {
            const id = `t${thu}t${Number(tiet)}`;
            if (kiemTraTrungTiet(id)) {
              return true;
            }
          }
        }

        return false;
      }

      //sự kiện chính xử lý chọn nhóm
      document
        .getElementById("container")
        .addEventListener("change", function (e) {
          if (!e.target.classList.contains("selectNh")) return;

          const { mahp, nhom } = layThongTinChon(e);
          if (!mahp || !nhom) return;

          xoaThoiBieuHP(mahp);

          const ds = DATA[mahp];
          if (!ds) return;

          const lop = timLopHoc(ds, nhom);
          if (!lop) return;

          if (kiemTraTrungLich(lop)) {
            alert("Môn học này bị trùng tiết!");
            return;
          }

          veThoiKhoaBieu(lop, mahp);
        });

      //tạo ra tất cả thời khóa biểu có thể
      function taoTatCaTKB(maHocPhanList) {
        const ketQua = [];
        const tkbHienTai = [];

        // Dùng để đánh dấu tiết đã dùng
        const daDungTiet = new Set();

        function kiemTraTrungLichIn(item) {
          const temp = new Set();
          const lop = item.lop;
          if (!lop || !lop.lich) return true;

          for (const lichItem of lop.lich) {
            for (const tiet of lichItem.tiet) {
              const id = `t${lichItem.thu}t${Number(tiet)}`;

              if (daDungTiet.has(id)) return true;
              if (temp.has(id)) return true;

              temp.add(id);
            }
          }
          return false;
        }
        function kiemTraTrungTiet(id) {
          return daDungTiet.has(id);
        }

        function themLop(item) {
          const lop = item.lop;

          for (const lichItem of lop.lich) {
            for (const tiet of lichItem.tiet) {
              const id = `t${lichItem.thu}t${tiet}`;
              daDungTiet.add(id);
            }
          }
        }

        function xoaLop(item) {
          const lop = item.lop;

          for (const lichItem of lop.lich) {
            for (const tiet of lichItem.tiet) {
              const id = `t${lichItem.thu}t${tiet}`;
              daDungTiet.delete(id);
            }
          }
        }

        function backtrack(index) {
          // Đã chọn đủ môn
          if (index === maHocPhanList.length) {
            ketQua.push([...tkbHienTai]);
            return;
          }

          const maHP = maHocPhanList[index];
          const danhSachLop = DATA[maHP] || [];

          for (const lop of danhSachLop) {
            const item = {
              lop: lop,
              maHocPhan: maHP,
            };

            if (!kiemTraTrungLichIn(item)) {
              tkbHienTai.push(item);
              themLop(item);

              backtrack(index + 1);

              xoaLop(item);
              tkbHienTai.pop();
            }
          }
        }

        backtrack(0);
        return ketQua;
      }
      let lichIndex = 0;
      function sinhTatCaLich() {
        const dsCacMaHocPhan = maHocPhanDaChon;
        thoiKhoaBieus = taoTatCaTKB(dsCacMaHocPhan);

        console.log(thoiKhoaBieus);

        lichIndex = 0;

        if (thoiKhoaBieus.length > 0) {
          capNhatBangTheoLich(thoiKhoaBieus[lichIndex]);
          hienDieuHuongLich();
        } else {
          alert("Không tìm được thời khóa biểu phù hợp!");
          document.getElementById("chonLich").innerHTML = "";
        }
      }

      function hienDieuHuongLich() {
        const chonLich = document.getElementById("chonLich");
        chonLich.innerHTML = `
        <button onclick="prevLich()">⬅ Lịch trước</button>
        <strong> Lịch ${lichIndex + 1} / ${thoiKhoaBieus.length} </strong>
        <button onclick="nextLich()">Lịch sau ➡</button>
    `;
      }
      function mod(n, m) {
        return ((n % m) + m) % m;
      }

      function prevLich() {
        lichIndex = mod(lichIndex - 1, thoiKhoaBieus.length);
        capNhatBangTheoLich(thoiKhoaBieus[lichIndex]);
        hienDieuHuongLich();
      }

      function nextLich() {
        lichIndex = mod(lichIndex + 1, thoiKhoaBieus.length);
        capNhatBangTheoLich(thoiKhoaBieus[lichIndex]);
        hienDieuHuongLich();
      }
      function capNhatBangTheoLich(tkb) {
        xoaTatCa();

        tkb.forEach((item) => {
          veThoiKhoaBieu(item.lop, item.maHocPhan);
        });
      }
    </script>
  </body>
</html>
